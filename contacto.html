</head>

<body>
    <nav id="navbar" aria-label="Principal">
        <a href="index.html"><img src="src/logo.png" alt="Montacargas CARU"></a>
        <ul class="tabs">
            <li class="tab-item"><a href="index.html">INICIO</a></li>
            <li class="tab-item"><a href="servicios.html">SERVICIOS</a></li>
            <li class="tab-item"><a href="nosotros.html">NOSOTROS</a></li>
            <li class="tab-item"><a href="contacto.html">CONTACTO</a></li>
        </ul>
    </nav>

    <header class="header">
        <img src="src/contactofondo.jpg" alt="Contacto Montacargas CARU">
        <div class="top-headings">
            <p class="heading4">- Contacta con Nosotros -</p>
            <h1 class="heading1" >
                Contacto
            </h1>
        </div>
    </header>

    <main class="main">
        <section class="contactus">
            <p class="eyebrow">- Estamos para Servirte</p>
            <h2 class="header2">
                Contacta con Nosotros
            </h2>
            <div class="contact-container">
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m14!1m8!1m3!1d230.67855553875958!2d-97.87048041713872!3d22.321251529198864!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x85d7f95820a2699d%3A0x465f1ac64865498!2sMontacargas%20CARU!5e0!3m2!1ses!2smx!4v1784606379617!5m2!1ses!2smx"
                    title="Ubicación de Montacargas CARU en Google Maps"
                    style="border:0;" allowfullscreen="" loading="lazy"
                    referrerpolicy="no-referrer-when-downgrade"></iframe>
                <form action="" class="index-form">
                    <div class="form-row">
                        <div class="form-field">
                            <label class="form-title" for="nombre">
                                Nombre
                            </label>
                            <input type="text" id="nombre" name="nombre" placeholder="Nombre" autocomplete="given-name" required>
                        </div>
                        <div class="form-field">
                            <label class="form-title" for="apellidos">
                                Apellidos
                            </label>
                            <input type="text" id="apellidos" name="apellidos" placeholder="Apellidos" autocomplete="family-name" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-field">
                            <label class="form-title" for="correo">
                                Correo
                            </label>
                            <input type="email" id="correo" name="correo" placeholder="Correo" autocomplete="email" required>
                        </div>
                        <div class="form-field">
                            <label class="form-title" for="telefono">
                                Teléfono
                            </label>
                            <input type="tel" id="telefono" name="telefono" placeholder="Teléfono" autocomplete="tel" required>
                        </div>
                    </div>
                    <label class="form-title" for="mensaje">
                        Mensaje
                    </label>
                    <textarea name="mensaje" id="mensaje" placeholder="Escríbenos un mensaje o una pregunta" required></textarea>
                    <button type="submit" id="form-btn">
                        Enviar
                    </button>
                </form>

            </div>
        </section>


    </main>

    <footer>
        © 2025 Montacargas CARU. Todos los derechos reservados.
    </footer>

</body>

<script src="script.js"></script>

</html>
